<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>401 Unauthorized</title>

    <style>
      * {
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
      }
      body {
        padding: 0;
        margin: 0;
      }
      #notfound {
        position: relative;
        height: 100vh;
      }
      #notfound .notfound {
        position: absolute;
        left: 50%;
        top: 50%;
        -webkit-transform: translate(-50%, -50%);
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
      }
      .notfound {
        max-width: 460px;
        width: 100%;
        text-align: center;
        line-height: 1.4;
      }
      .notfound .notfound-401 {
        position: relative;
        width: 180px;
        height: 180px;
        margin: 0 auto 50px;
      }
      .notfound .notfound-401 > div:first-child {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        background: #e74c3c;
        -webkit-transform: rotate(45deg);
        -ms-transform: rotate(45deg);
        transform: rotate(45deg);
        border: 5px dashed #fff;
        border-radius: 5px;
      }
      .notfound .notfound-401 > div:first-child:before {
        content: "";
        position: absolute;
        left: -5px;
        right: -5px;
        bottom: -5px;
        top: -5px;
        -webkit-box-shadow: 0 0 0 5px rgba(231, 76, 60, 0.2) inset;
        box-shadow: 0 0 0 5px rgba(231, 76, 60, 0.2) inset;
        border-radius: 5px;
      }
      .notfound .notfound-401 h1 {
        font-family: cabin, sans-serif;
        color: #fff;
        font-weight: 700;
        margin: 0;
        font-size: 90px;
        position: absolute;
        top: 50%;
        -webkit-transform: translate(-50%, -50%);
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
        left: 50%;
        text-align: center;
        height: 40px;
        line-height: 40px;
      }
      .notfound h2 {
        font-family: cabin, sans-serif;
        font-size: 33px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 7px;
        color: #e74c3c;
      }
      .notfound p {
        font-family: cabin, sans-serif;
        font-size: 16px;
        color: #333;
        font-weight: 400;
      }
      .notfound a {
        font-family: cabin, sans-serif;
        display: inline-block;
        padding: 10px 25px;
        background-color: #e74c3c;
        border: none;
        border-radius: 40px;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        text-decoration: none;
        -webkit-transition: 0.2s all;
        transition: 0.2s all;
      }
      .notfound a:hover {
        background-color: #c0392b;
      }
    </style>
  </head>
  <body>
    <div id="notfound">
      <div class="notfound">
        <div class="notfound-401">
          <div></div>
          <h1>401</h1>
        </div>
        <h2>Unauthorized</h2>
        <p>You are not authorized to access this page. Please check your credentials or log in.</p>
      </div>
    </div>
  </body>
</html>
