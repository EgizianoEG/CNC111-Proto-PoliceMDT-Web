<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="San Diego Police Department Mobile Data Terminal (MDT) Demo"
    />
    <meta name="keywords" content="San Diego Police Department, Mobile Data Terminal, MDT, Demo" />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="manifest" href="./assets/data/site.webmanifest" />
    <link rel="icon" href="./assets/images/favicon/favicon.ico" sizes="any" />

    <title>SDPD &mdash; MDT Login</title>
    <link rel="stylesheet" href="../../../assets/styles/login.css" />
  </head>
  <body>
    <div class="login-container">
      <h1>San Diego Police Department</h1>
      <h2>Mobile Data Terminal (MDT) &mdash; Log In</h2>
      <form id="login-form" action="/login" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required autofocus />

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />

        <button type="submit" id="login-button">Login</button>
      </form>
    </div>
  </body>
</html>
