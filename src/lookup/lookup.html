<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="San Diego Police Department Mobile Data Terminal (MDT) Demo"
    />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="manifest" href="../../assets/data/site.webmanifest" />
    <link rel="icon" href="../../assets/images/favicon/favicon.ico" sizes="any" />

    <title>SDPD &mdash; Lookup</title>
    <link rel="stylesheet" type="text/css" href="../../assets/styles/base.css" />
    <link rel="stylesheet" type="text/css" href="../../assets/styles/shell.css" />
    <link rel="stylesheet" type="text/css" href="../../assets/styles/lookup.css" />
    <script type="module" src="./lookup.js"></script>
  </head>
  <body>
    <div class="mdt-shell">
      <header class="topbar prevent-select">
        <div class="topbar__brand">
          <div class="badge-icon badge-icon--sm" aria-hidden="true">
            <img class="badge-icon__img" src="../../assets/images/sdpd-logo.png" alt="SDPD Logo" />
          </div>
          <span class="topbar__title">SDPD &mdash; MDT</span>
        </div>

        <div class="topbar__status">
          <span class="topbar__officer"></span>
          <span class="topbar__shift"></span>
          <a href="../login/login.html" class="btn btn--ghost">Log Out</a>
        </div>
      </header>

      <div class="mdt-body">
        <nav class="sidebar" aria-label="MDT Sections">
          <ul class="sidebar__list">
            <li><a href="../dashboard/dashboard.html" class="sidebar__link">Dashboard</a></li>
            <li><a href="./lookup.html" class="sidebar__link sidebar__link--active">Lookup</a></li>
            <li><span class="sidebar__link">Citations</span></li>
            <li><a href="../bolos/bolos.html" class="sidebar__link">BOLOs</a></li>
            <li><a href="../incidents/incidents.html" class="sidebar__link">Incidents</a></li>
            <li><span class="sidebar__link">Arrests</span></li>
            <li><a href="../roster/roster.html" class="sidebar__link">Roster</a></li>
          </ul>
        </nav>

        <main class="content">
          <section class="page-heading">
            <h1>Lookup</h1>
            <p class="page-heading__subtitle">
              Search department records by category. Choose a record type, enter a name, then press
              search.
            </p>
          </section>

          <section class="lookup-panel" aria-label="Record Search">
            <form id="lookup-form" class="lookup-form" novalidate>
              <div class="form-field form-field--select">
                <label for="lookup-type">Record type</label>
                <select id="lookup-type" name="lookup-type">
                  <option value="individuals">Individuals</option>
                  <option value="incidents">Reports</option>
                  <option value="vehicles" disabled>Plates (unavailable)</option>
                  <option value="citations_disabled" disabled>Citations (unavailable)</option>
                  <option value="arrests_disabled" disabled>Arrests (unavailable)</option>
                </select>
              </div>

              <div class="form-field form-field--query">
                <label for="lookup-query">Search term</label>
                <input
                  type="text"
                  id="lookup-query"
                  name="lookup-query"
                  placeholder="Enter a name or keyword"
                  minlength="2"
                  maxlength="64"
                  required
                  autofocus
                  autocomplete="off"
                  autocapitalize="off"
                  autocorrect="off"
                />
              </div>

              <button type="submit" id="lookup-button" class="btn btn--primary">Search</button>

              <div class="form-field form-field--database">
                <input type="checkbox" id="lookup-fed-database" disabled />
                <label for="lookup-fed-database">Include federal database</label>

                <input type="checkbox" id="lookup-local-database" checked disabled />
                <label for="lookup-local-database">Include local database</label>
              </div>
            </form>
          </section>

          <section class="lookup-results" aria-label="Search Results">
            <table id="lookup-results-table" class="data-table" hidden>
              <thead id="lookup-results-head" class="data-table__heading"></thead>
              <tbody id="lookup-results-body" class="data-table__body"></tbody>
            </table>
            <p id="lookup-results-notice" class="lookup-results__notice">
              Enter a search term above to look up records.
            </p>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
