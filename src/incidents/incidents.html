<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="San Diego Police Department Mobile Data Terminal (MDT) Demo"
    />

    <link rel="manifest" href="../../assets/data/site.webmanifest" />
    <link rel="icon" href="../../assets/images/favicon/favicon.ico" sizes="any" />

    <title>SDPD &mdash; Incidents</title>
    <link rel="stylesheet" type="text/css" href="../../assets/styles/base.css" />
    <link rel="stylesheet" type="text/css" href="../../assets/styles/shell.css" />
    <link rel="stylesheet" type="text/css" href="../../assets/styles/incidents.css" />
    <script type="module" src="./incidents.js"></script>
  </head>
  <body>
    <div class="mdt-shell">
      <header class="topbar prevent-select">
        <div class="topbar__brand">
          <div class="badge-icon badge-icon--sm" aria-hidden="true">
            <img class="badge-icon__img" src="../../assets/images/sdpd-logo.png" alt="SDPD Logo" />
          </div>
          <span class="topbar__title">SDPD &mdash; MDT</span>
        </div>

        <div class="topbar__status">
          <span class="topbar__officer"></span>
          <span class="topbar__shift"></span>
          <a href="../login/login.html" class="btn btn--ghost">Log Out</a>
        </div>
      </header>

      <div class="mdt-body">
        <nav class="sidebar" aria-label="MDT sections">
          <ul class="sidebar__list">
            <li><a href="../dashboard/dashboard.html" class="sidebar__link">Dashboard</a></li>
            <li><a href="../lookup/lookup.html" class="sidebar__link">Lookup</a></li>
            <li><span class="sidebar__link">Citations</span></li>
            <li><a href="../bolos/bolos.html" class="sidebar__link">BOLOs</a></li>
            <li>
              <a href="./incidents.html" class="sidebar__link sidebar__link--active">Incidents</a>
            </li>
            <li><span class="sidebar__link">Arrests</span></li>
            <li><a href="../roster/roster.html" class="sidebar__link">Roster</a></li>
          </ul>
        </nav>

        <main class="content">
          <section class="page-heading">
            <h1>Incidents</h1>
            <p class="page-heading__subtitle">File and review incident reports.</p>
          </section>

          <section class="incident-form-panel" aria-label="File a new incident">
            <h2 class="section__title">File a New Incident</h2>
            <form id="incident-form" class="incident-form" novalidate>
              <div class="form-row">
                <div class="form-field">
                  <label for="incident-type">Type</label>
                  <input
                    type="text"
                    id="incident-type"
                    name="incident-type"
                    placeholder="e.g. Burglary, Traffic Collision"
                    minlength="3"
                    maxlength="100"
                    required
                  />
                </div>

                <div class="form-field">
                  <label for="incident-location">Location</label>
                  <input
                    type="text"
                    id="incident-location"
                    name="incident-location"
                    placeholder="e.g. 220 5th Ave, San Diego, CA"
                    minlength="5"
                    maxlength="200"
                  />
                </div>
              </div>

              <div class="form-field">
                <label for="incident-description">Description</label>
                <textarea
                  id="incident-description"
                  name="incident-description"
                  rows="4"
                  placeholder="What happened?"
                  minlength="10"
                  maxlength="1000"
                  required
                ></textarea>
              </div>

              <button type="submit" id="incident-submit-button" class="btn btn--primary">
                File Incident
              </button>
            </form>
          </section>

          <section class="incident-list-panel" aria-label="Recent incidents">
            <h2 class="section__title">Recent Incidents</h2>
            <table id="incidents-table" class="data-table">
              <thead class="data-table__head">
                <tr>
                  <th scope="col">Type</th>
                  <th scope="col">Description</th>
                  <th scope="col">Location</th>
                  <th scope="col">Status</th>
                  <th scope="col">Reported</th>
                  <th scope="col">Officer</th>
                </tr>
              </thead>
              <tbody id="incidents-table-body" class="data-table__body">
                <tr>
                  <td colspan="6">Loading incidents&hellip;</td>
                </tr>
              </tbody>
            </table>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
