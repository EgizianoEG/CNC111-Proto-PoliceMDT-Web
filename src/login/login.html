<!doctype html>
<html lang="en">
  <head>
    <!-- Metadata -->
    <meta charset="utf-8" />
    <meta name="keywords" content="San Diego Police Department, Mobile Data Terminal, MDT, Demo" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="San Diego Police Department Mobile Data Terminal (MDT) Demo"
    />

    <!-- Title & favicon -->
    <title>SDPD &mdash; MDT Login</title>
    <link rel="manifest" href="../../assets/data/site.webmanifest" />
    <link rel="icon" href="../../assets/images/favicon/favicon.ico" sizes="any" />

    <!-- Styles -->
    <link rel="stylesheet" type="text/css" href="../../assets/styles/base.css" />
    <link rel="stylesheet" type="text/css" href="../../assets/styles/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Scripts -->
    <script type="module" src="../../assets/scripts/main.js" defer></script>
    <script type="module" src="login.js"></script>
  </head>
  <body>
    <main class="login-screen">
      <!-- Left/upper branding/title panel -->
      <div class="brand-panel prevent-select">
        <div class="brand-panel__content">
          <div class="badge-icon">
            <img
              class="badge-icon__img"
              src="../../assets/images/sdpd-logo.png"
              alt="San Diego Police Department Badge"
            />
          </div>
          <h1 class="brand-panel__title">San Diego Police Department</h1>
          <p class="brand-panel__subtitle">Mobile Data Terminal</p>
        </div>
      </div>

      <!-- The card panel for login; username and password -->
      <div class="login-panel">
        <div class="login-card prevent-select">
          <h2 class="login-card__heading">MDT Login</h2>
          <p class="login-card__notice">Authorized Personnel Only</p>

          <form
            id="login-form"
            class="login-form"
            action="../dashboard/dashboard.html"
            method="GET"
          >
            <div class="form-field">
              <label for="username">Badge / Username</label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter badge number or username"
                title="Username must be 6-32 characters long and contain only letters, numbers, and underscores. Hint: use 'jramirez'"
                autocomplete="username"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                pattern="^[a-zA-Z0-9_]{6,32}$"
                minlength="6"
                maxlength="32"
                required
                autofocus
              />
            </div>

            <div class="form-field">
              <label for="password">Password</label>

              <div class="password-input">
                <input
                  type="password"
                  id="password"
                  name="password"
                  minlength="8"
                  maxlength="32"
                  placeholder="Enter password"
                  title="Password must be 8-32 characters long. Hint: use 'password123'"
                  autocomplete="current-password"
                  autocapitalize="off"
                  autocorrect="off"
                  spellcheck="false"
                  required
                />

                <i
                  class="fa-regular fa-eye fa-pass-icon"
                  id="toggle-password"
                  aria-label="Show password"
                  title="Show password"
                  role="button"
                  tabindex="0"
                ></i>
              </div>
            </div>

            <button type="submit" id="login-button" class="btn btn--primary">
              Access Terminal
            </button>
          </form>
        </div>

        <!-- disclaimer footer -->
        <footer class="login-footer">
          <p>SDPD &ndash; MDT v0.2</p>
          <p class="login-footer__disclaimer">
            <span class="login-footer__disclaimer-label">Disclaimer:</span> This is a fictional
            roleplay system created for academic purposes. Not affiliated with or representing the
            real San Diego Police Department.
          </p>
        </footer>
      </div>
    </main>
  </body>
</html>
